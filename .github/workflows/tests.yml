name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs full level-1-to-200 searches: ~2m45s on the dev box, and a CI runner is
    # slower still. The cap is a runaway guard, not a target.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run engine tests
        run: node tests/engine.test.js
